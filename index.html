<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending Song Radar</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --text:#e8ecf1; --muted:#8b96a5; --hi:#22c55e; --mid:#f59e0b; --lo:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 16px 8px; max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:900px; margin:0 auto; padding:8px 16px 40px; display:grid; gap:12px; }
  .card { display:flex; gap:12px; background:var(--card); border-radius:12px; padding:10px; text-decoration:none; color:inherit; }
  .card img { width:128px; height:72px; object-fit:cover; border-radius:8px; flex:none; background:#222; }
  .info { flex:1; min-width:0; }
  .title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; font-size:12px; }
  .stats span { background:#222a35; padding:2px 8px; border-radius:999px; }
  .score { text-align:center; min-width:64px; align-self:center; }
  .score b { font-size:24px; display:block; }
  .score small { font-size:11px; color:var(--muted); }
  .high b { color:var(--hi); } .mid b { color:var(--mid); } .low b { color:var(--lo); }
  .bar { height:4px; background:#222a35; border-radius:2px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:currentColor; }
  .tabs { display:flex; gap:8px; margin-top:10px; }
  .tabs button { background:#222a35; color:var(--text); border:0; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .tabs button.on { background:var(--hi); color:#04210f; font-weight:600; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  @media (max-width:520px){ .card img{ width:96px; height:54px; } }
</style>
</head>
<body>
<header>
  <h1>🎵 Trending Song Radar</h1>
  <div class="sub" id="status">Loading…</div>
  <div class="tabs">
    <button id="t-score" class="on" onclick="setSort('score')">Trend score</button>
    <button id="t-opp" onclick="setSort('opportunity')">Opportunity (few karaoke)</button>
  </div>
</header>
<main id="list"></main>

<script>
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"K" : String(n);
const age = m => m < 60 ? m+" min ago" : Math.floor(m/60)+"h "+(m%60)+"m ago";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let sortBy = "score";
function setSort(k) {
  sortBy = k;
  document.getElementById("t-score").classList.toggle("on", k === "score");
  document.getElementById("t-opp").classList.toggle("on", k === "opportunity");
  load();
}

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now());
    const d = await r.json();
    const mins = Math.round((Date.now() - new Date(d.generated_at)) / 60000);
    document.getElementById("status").textContent =
      `Songs released in the last ${d.window_hours}h · regions: ${d.regions.join(", ")} · updated ${mins} min ago · ${d.songs.length} tracked`;
    const list = document.getElementById("list");
    if (!d.songs.length) { list.innerHTML = '<div class="empty">No songs found yet.</div>'; return; }
    list.innerHTML = [...d.songs].sort((a, b) => (b[sortBy] ?? -1) - (a[sortBy] ?? -1)).map(s => {
      const v = s[sortBy];
      const cls = v == null ? "low" : v >= 60 ? "high" : v >= 35 ? "mid" : "low";
      const accel = s.acceleration == null ? "" : `<span>${s.acceleration >= 1 ? "📈" : "📉"} ${s.acceleration}× pace</span>`;
      const kar = s.karaoke_count == null ? `<span>🎤 not checked yet</span>` :
        `<span title="${esc((s.karaoke_links || []).map(k => k.title).join(' | ') || 'No karaoke versions found yet')}">🎤 ${s.karaoke_count} karaoke${s.karaoke_count === 0 ? " · gap!" : ""}</span>`;
      return `<a class="card ${cls}" href="${s.url}" target="_blank" rel="noopener">
        <img src="${s.thumbnail}" alt="">
        <div class="info">
          <div class="title">${esc(s.title)}</div>
          <div class="meta">${esc(s.channel)} · ${fmt(s.subs)} subs · ${age(s.age_min)}</div>
          <div class="stats">
            <span>👁 ${fmt(s.views)}</span><span>⚡ ${fmt(s.views_per_hour)}/h</span>
            <span>👍 ${fmt(s.likes)}</span><span>💬 ${fmt(s.comments)}</span>${kar}${accel}
          </div>
          <div class="bar"><i style="width:${v ?? 0}%"></i></div>
        </div>
        <div class="score"><b>${v == null ? "—" : Math.round(v) + "%"}</b><small>${sortBy === "score" ? "trend score" : "opportunity"}</small></div>
      </a>`;
    }).join("");
  } catch (e) {
    document.getElementById("status").textContent = "data.json not found yet. Run tracker.py first (and open this page via http://, not file://).";
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
